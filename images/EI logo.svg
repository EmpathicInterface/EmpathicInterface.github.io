<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="200" height="200" fill="#0B1F3F" rx="32"/>

  <!-- Outer Border Frame -->
  <rect x="15" y="15" width="170" height="170" fill="none" stroke="#FFC72C" stroke-width="3" opacity="0.4" rx="22"/>

  <!-- Main Monogram (EI) -->
  <text x="100" y="115" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="68" fill="#FFC72C" text-anchor="middle" letter-spacing="2">
    EI
  </text>

  <!-- Sub Text (LAB) -->
  <text x="100" y="150" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="6" opacity="0.9">
    LAB
  </text>
</svg>
